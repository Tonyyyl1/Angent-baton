<title>多设备接力工作台</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* 版式：顶部是两条设备跑道，中间夹着虚线围出的交接区；下面是可筛选的项目台账，
   展开一行就能看到换设备后每样东西落在哪一级。颜色只表示恢复层级，操作按钮用墨色。 */
:root{
  --bg:#f1f4f2; --surface:#ffffff; --sunken:#e8edea; --ink:#13201b; --muted:#566660; --faint:#85948e;
  --line:#d5ddd9; --line-strong:#b6c2bc;
  --native:#0a7354; --native-bg:#dbf1e7;
  --git:#2350bf; --git-bg:#e0e7fb;
  --extra:#8a5100; --extra-bg:#f9ebd0;
  --manual:#9c2859; --manual-bg:#f8dfe9;
  --danger:#b0261e; --danger-bg:#fbe3e0;
  --btn:#13201b; --btn-ink:#ffffff; --focus:#2350bf; --shade:rgba(10,20,16,.45);
  --font-display:"Space Grotesk","PingFang SC","Microsoft YaHei UI","Microsoft YaHei","Noto Sans SC",sans-serif;
  --font-body:"IBM Plex Sans","PingFang SC","Microsoft YaHei UI","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono","Cascadia Mono",Consolas,Menlo,"PingFang SC","Microsoft YaHei UI",monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0d1311; --surface:#151c19; --sunken:#101714; --ink:#e3ebe7; --muted:#9babA5; --faint:#6d7e78;
  --line:#26312d; --line-strong:#3a4842;
  --native:#55d4a8; --native-bg:#0f3529; --git:#90aeff; --git-bg:#17254a;
  --extra:#f0b75c; --extra-bg:#39290b; --manual:#f293ba; --manual-bg:#3d1627;
  --danger:#ff9087; --danger-bg:#421714; --btn:#e3ebe7; --btn-ink:#0d1311; --focus:#90aeff; --shade:rgba(0,0,0,.6);
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0d1311; --surface:#151c19; --sunken:#101714; --ink:#e3ebe7; --muted:#9baba5; --faint:#6d7e78;
  --line:#26312d; --line-strong:#3a4842;
  --native:#55d4a8; --native-bg:#0f3529; --git:#90aeff; --git-bg:#17254a;
  --extra:#f0b75c; --extra-bg:#39290b; --manual:#f293ba; --manual-bg:#3d1627;
  --danger:#ff9087; --danger-bg:#421714; --btn:#e3ebe7; --btn-ink:#0d1311; --focus:#90aeff; --shade:rgba(0,0,0,.6);
  color-scheme:dark }

*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.55 var(--font-body);-webkit-font-smoothing:antialiased}
.wrap{max-width:1220px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:22px 72px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3,h4{margin:0;font-family:var(--font-display);text-wrap:balance;letter-spacing:-.01em;line-height:1.25}
p{margin:0}
code,pre,.mono{font-family:var(--font-mono);font-size:.88em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
@media (prefers-reduced-motion:no-preference){ .prow-main,.btn,.tab,.tog,.pchip{transition:background-color .12s,border-color .12s,color .12s} }

/* 控件 */
.btn{appearance:none;border:1px solid var(--line-strong);background:var(--surface);border-radius:7px;padding:6px 12px;min-height:34px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.btn.primary:hover{opacity:.88}
.btn.ghost{background:transparent}
.btn.small{min-height:28px;padding:2px 9px;font-size:12.5px}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.inp,select.inp,textarea.inp{border:1px solid var(--line-strong);background:var(--surface);border-radius:7px;padding:6px 10px;min-height:34px;min-width:0;width:100%}
textarea.inp{min-height:68px;resize:vertical;line-height:1.5}
.inp.mono{font-size:12.5px}
.tier{display:inline-flex;align-items:center;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:500;white-space:nowrap}
.tier.native,.bcol.native>header{background:var(--native-bg);color:var(--native)}
.tier.git,.bcol.git>header{background:var(--git-bg);color:var(--git)}
.tier.extra,.bcol.extra>header{background:var(--extra-bg);color:var(--extra)}
.tier.manual,.bcol.manual>header{background:var(--manual-bg);color:var(--manual)}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line-strong);border-radius:6px;padding:0 7px;font-size:12px;white-space:nowrap;background:var(--surface)}
.chip.solid{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.warn{background:var(--extra-bg);color:var(--extra);border-color:transparent;font-weight:500}
.chip.transit{border-style:dashed;border-color:var(--ink)}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.lbl{font-size:11.5px;letter-spacing:.06em;color:var(--muted)}

/* 页头 */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px}
.brand h1{font-size:27px;font-weight:700}
.brand p{margin-top:5px;color:var(--muted);max-width:64ch}
.here{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.here select{width:auto}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--surface)}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--faint)}
.sync.db::before{background:var(--native)} .sync.local::before{background:var(--extra)}
.notice{border:1px solid var(--extra);background:var(--extra-bg);color:var(--extra);border-radius:8px;padding:8px 12px}

/* 跑道 */
.track{display:grid;grid-template-columns:minmax(0,1fr) minmax(170px,230px) minmax(0,1fr);border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.track.multi{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.lane{padding:16px 18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.track.multi .lane{border-bottom:1px solid var(--line)}
.lane-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lane-head h2{font-size:17px;font-weight:600;overflow-wrap:anywhere}
.os{font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;border:1px solid var(--line-strong);border-radius:4px;padding:0 5px;color:var(--muted)}
.lane-stats{color:var(--muted);font-size:13px;display:flex;flex-wrap:wrap;gap:2px 12px}
.lane-stats b{color:var(--ink);font-family:var(--font-display);font-size:15px;font-variant-numeric:tabular-nums;margin-right:3px}
.lane-chips{display:flex;flex-wrap:wrap;gap:6px}
.pchip{appearance:none;border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:2px 10px;font-size:12.5px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;max-width:100%}
.pchip:hover{border-color:var(--ink)}
.pchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pchip i{width:7px;height:7px;border-radius:50%;background:var(--extra);flex:none}
.transit{border-inline:1px dashed var(--line-strong);background:var(--sunken);padding:16px 12px;display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center;min-width:0}
.transit h2{font-size:13px;font-weight:600;letter-spacing:.08em}
.transit .pchip{border-style:dashed;border-color:var(--ink)}
.transit p{font-size:12.5px;color:var(--muted)}

/* 标签页与筛选 */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{appearance:none;border:0;background:none;padding:9px 14px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.tab .n{font-family:var(--font-mono);font-size:11px;margin-left:5px;color:var(--faint)}
.tab .n.hot{background:var(--native-bg);color:var(--native);border-radius:999px;padding:1px 7px;font-weight:600}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters .inp{width:auto;flex:0 1 150px}
.filters #f-q{flex:1 1 200px}
.filters .count{color:var(--muted);font-size:12.5px;margin-left:auto;font-variant-numeric:tabular-nums}

/* 项目台账 */
.plist{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.phead,.prow-main{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1.15fr) minmax(0,1.3fr) 96px minmax(0,1.2fr) minmax(0,1.35fr);gap:6px 14px;align-items:center;padding:10px 16px}
.phead{font-size:11.5px;letter-spacing:.06em;color:var(--muted);background:var(--sunken);border-bottom:1px solid var(--line);padding-block:7px}
.prow + .prow{border-top:1px solid var(--line)}
.prow-main{width:100%;text-align:left;border:0;background:none;cursor:pointer}
.prow-main:hover,.prow.open>.prow-main{background:var(--sunken)}
.prow-main>span{min-width:0;display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center}
.p-name{flex-direction:column;align-items:flex-start!important;gap:0!important}
.p-name b{font-weight:600;font-size:14.5px;overflow-wrap:anywhere}
.p-name code{color:var(--muted);font-size:11.5px;overflow-wrap:anywhere}
.p-branch code{overflow-wrap:anywhere}
.p-next{grid-column:1/-1;color:var(--muted);font-size:13px;gap:8px!important;flex-wrap:nowrap!important;align-items:baseline!important}
.p-next em{font-style:normal;color:var(--ink);overflow-wrap:anywhere}
.tsum{font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
.tsum.native{color:var(--native)} .tsum.git{color:var(--git)} .tsum.extra{color:var(--extra)} .tsum.manual{color:var(--manual)}
.tsum b{font-weight:600}
.pdetail{padding:14px 16px 22px;display:flex;flex-direction:column;gap:18px;border-top:1px dashed var(--line-strong)}
.pd-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pd-actions .upd{margin-left:auto;color:var(--faint);font-size:12px}
.notes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.note h5{margin:0 0 3px;font:500 11.5px/1.4 var(--font-body);letter-spacing:.06em;color:var(--muted)}
.note p{white-space:pre-wrap;overflow-wrap:anywhere}
.sec h4{font-size:14.5px;font-weight:600;margin-bottom:8px}
.sec h4 small{font:400 12.5px var(--font-body);color:var(--muted);margin-left:8px;letter-spacing:0}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.bcol{border:1px solid var(--line);border-radius:10px;overflow:hidden;min-width:0}
.bcol>header{padding:7px 12px;font-weight:600;font-size:13px;display:flex;justify-content:space-between;gap:8px}
.bcol ul{list-style:none;margin:0;padding:10px 12px 12px;display:flex;flex-direction:column;gap:9px}
.bcol li b{display:block;font-weight:500;overflow-wrap:anywhere}
.bcol li span{display:block;color:var(--muted);font-size:12.5px;overflow-wrap:anywhere}
.bcol li.fixed b{font-weight:400;color:var(--muted)}
.foot{color:var(--muted);font-size:12.5px;max-width:78ch}
.scroll-x{overflow-x:auto}
table.t{border-collapse:collapse;width:100%;min-width:640px}
table.t th{font:500 11.5px var(--font-body);letter-spacing:.06em;color:var(--muted);text-align:left;padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.t tr:last-child td{border-bottom:0}
table.t td code{overflow-wrap:anywhere}
.cell-stack{display:flex;flex-direction:column;gap:3px;align-items:flex-start}
.tier-line{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12.5px}
.reg{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.regitem{border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.regitem .rt{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.regitem .rt b{font-weight:500;overflow-wrap:anywhere}
.regitem small{color:var(--muted);font-size:12px}
.togs{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tog{appearance:none;border:1px solid var(--line-strong);background:transparent;border-radius:6px;padding:1px 9px;font-size:12px;cursor:pointer;color:var(--muted)}
.tog[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.empty{padding:34px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty b{color:var(--ink);font-family:var(--font-display);font-size:16px}
.list-plain{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.conf{border:1px solid var(--line);border-radius:8px;padding:9px 12px;display:flex;flex-direction:column;gap:4px}
.conf .ch{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.conf p{overflow-wrap:anywhere;white-space:pre-wrap}

/* 接力 */
.panel{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:16px 18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel>h3{font-size:16px;font-weight:600}
.panel>h3 small{font:400 12.5px var(--font-body);color:var(--muted);margin-left:8px;letter-spacing:0}
.route{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-family:var(--font-display);font-size:17px;font-weight:600}
.route .arrow{font-family:var(--font-mono);color:var(--muted)}
.steps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
.opt{border:1px solid var(--line-strong);border-radius:8px;padding:9px 11px;display:flex;gap:9px;align-items:flex-start;cursor:pointer}
.opt:has(input:checked){border-color:var(--ink);background:var(--sunken)}
.opt b{display:block;font-weight:500}
.opt small{color:var(--muted);font-size:12.5px}
.chk{display:flex;gap:9px;align-items:flex-start;padding:6px 0;border-bottom:1px solid var(--line);cursor:pointer}
.chk:last-of-type{border-bottom:0}
.chk input{margin-top:3px;flex:none;width:16px;height:16px}
.chk b{display:block;font-weight:500}
.chk small{display:block;color:var(--muted);font-size:12.5px}
.chk:has(input:checked) b{text-decoration:line-through;color:var(--muted)}
.cmds{display:flex;flex-direction:column;gap:10px;min-width:0}
.cmd{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--sunken);min-width:0}
.cmd.remote{border-color:var(--danger)}
.cmd-head{display:flex;align-items:center;gap:8px;padding:5px 6px 5px 12px;border-bottom:1px solid var(--line);font-size:12.5px;flex-wrap:wrap}
.cmd-head b{font-weight:500}
.cmd-head .btn{margin-left:auto}
.ktag{font-size:11.5px;border-radius:4px;padding:0 6px;border:1px solid var(--line-strong);color:var(--muted)}
.ktag.remote{background:var(--danger-bg);color:var(--danger);border-color:transparent;font-weight:500}
.cmd pre{margin:0;padding:10px 12px;overflow-x:auto;font-size:12.5px;line-height:1.65;white-space:pre;tab-size:2}
.cmd pre .c{color:var(--faint)}
.callout{border:1px solid var(--line-strong);border-radius:10px;padding:11px 14px;display:flex;flex-direction:column;gap:6px;background:var(--surface)}
.callout.secret{border-color:var(--danger);background:var(--danger-bg)}
.callout.secret h4{color:var(--danger)}
.callout h4{font-size:13.5px;font-weight:600}
.callout ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
.callout.honest{border-style:dashed;border-color:var(--ink)}
.sync-events,.sync-problems{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px;font-size:12.5px;max-height:260px;overflow:auto}
.sync-action{word-break:break-all}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grow{flex:1}
.legend{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.legend>div{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:5px;background:var(--surface)}
.legend p{color:var(--muted);font-size:12.5px}
.setgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.field{display:flex;flex-direction:column;gap:3px;min-width:0}
.field>span{font-size:12px;color:var(--muted)}
.field small{font-size:12px;color:var(--faint)}

/* 对话框 */
dialog{border:1px solid var(--line-strong);border-radius:12px;background:var(--surface);color:var(--ink);padding:0;width:min(720px,calc(100vw - 24px));max-height:calc(100dvh - 32px)}
dialog::backdrop{background:var(--shade)}
.form{display:flex;flex-direction:column;max-height:calc(100dvh - 34px)}
.form>header,.form>footer{display:flex;align-items:center;gap:8px;padding:12px 16px}
.form>header{border-bottom:1px solid var(--line);justify-content:space-between}
.form>header h3{font-size:16px}
.form>footer{border-top:1px solid var(--line);flex-wrap:wrap}
.form-body{padding:14px 16px;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form-grid .span2{grid-column:1/-1}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:8px;padding:8px 14px;font-size:13px;z-index:30;max-width:calc(100vw - 32px)}

/* 云接力、待接棒与历史对话查阅 */
.banner-ok{border:1.5px solid var(--native);background:var(--native-bg);color:var(--ink);border-radius:10px;padding:13px 16px;display:flex;flex-direction:column;gap:7px}
.banner-ok h4{color:var(--native);font-size:17px;font-weight:700}
.cloud-card{border:1.5px solid var(--line-strong);border-radius:12px;background:var(--surface);padding:16px 18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.cloud-card.paired{border-color:var(--native)}
.fp-box{border:1px dashed var(--line-strong);border-radius:8px;padding:10px 12px;background:var(--sunken);display:flex;flex-direction:column;gap:4px}
.fp-code{font-family:var(--font-mono);font-size:14.5px;font-weight:600;letter-spacing:.05em;overflow-wrap:anywhere}
.inbox-list{display:flex;flex-direction:column;gap:12px}
.inbox-item{border:1px solid var(--line-strong);border-radius:10px;padding:14px 16px;background:var(--surface);display:flex;flex-direction:column;gap:10px}
.tx-dlg{width:min(980px,calc(100vw - 24px))}
.tx-layout{display:grid;grid-template-columns:minmax(220px,290px) minmax(0,1fr);gap:12px;min-height:360px;max-height:calc(100dvh - 200px)}
.tx-side{border:1px solid var(--line);border-radius:8px;overflow-y:auto;display:flex;flex-direction:column;background:var(--surface)}
.tx-sbtn{appearance:none;border:0;border-bottom:1px solid var(--line);background:none;padding:9px 11px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:3px}
.tx-sbtn:last-child{border-bottom:0}
.tx-sbtn:hover,.tx-sbtn[aria-current="true"]{background:var(--sunken)}
.tx-main{border:1px solid var(--line);border-radius:8px;padding:12px 14px;overflow-y:auto;background:var(--sunken);display:flex;flex-direction:column;gap:10px;min-width:0}
.tx-md{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.65 var(--font-mono)}
.tx-hit{border:1px solid var(--line-strong);border-radius:8px;padding:8px 10px;background:var(--surface);display:flex;flex-direction:column;gap:4px}

@media (max-width:980px){
  .phead{display:none}
  .prow-main{grid-template-columns:repeat(2,minmax(0,1fr))}
  .p-name{grid-column:1/-1}
  .notes,.board,.legend{grid-template-columns:repeat(2,minmax(0,1fr))}
  .steps{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:720px){
  .track{grid-template-columns:minmax(0,1fr)}
  .transit{border-inline:0;border-block:1px dashed var(--line-strong)}
  .pd-actions .upd{margin-left:0;width:100%}
  .tx-layout{grid-template-columns:minmax(0,1fr);max-height:none}
  .tx-side{max-height:190px}
}

    ['desk', '在台账里更新最近任务、下一步动作、验证结果', ''],
    ['carry', git ? '按给出的命令带走代码' + (dirty ? (p.dirty > 0 ? '和 ' + p.dirty + ' 个未提交文件' : '和未提交改动') : '') : '按给出的命令复制整个目录', tr === 'patch' ? '补丁不会清空本机改动。接力完成后回到这台设备时先 git stash push -u，免得两边各改一份。' : ''],
    git ? ['stash', '确认 stash 和别的 worktree 里没有落下的工作', 'stash 不随 push、bundle、补丁走。'] : null,
    extras.length ? ['extra', '带走需要额外同步的本地状态', extras.map(x => x.label).join('、')] : null,
    ['secrets', '确认凭据没有混进去', '.env、auth.json、令牌、私钥不在提交、bundle、补丁和中转目录里。']
  ].filter(Boolean);
  const postChecks = [
    git ? ['clean', '确认 ' + T.name + ' 的工作区是干净的', '那边有自己的改动时先收起来，再套用带过来的内容。'] : null,
    ['pull', '取回代码' + (dirty ? '和未提交改动' : ''), '按给出的命令做。出现冲突就停下，不强推、不覆盖，记一条冲突记录。'],
    extras.length ? ['extra', '放回额外同步的文件', extras.map(x => x.label).join('、')] : null,
    p.worktree ? ['worktree', '重建 worktree', ''] : null,
    ['login', '确认这台设备已登录', 'Claude Code、Codex、Antigravity、MCP 连接器、SSH 密钥、.env 都在这台设备各自配置。'],
    ['context', '接上上下文', '开新 Session，对代理说「接棒」。云端 Session 可以直接打开原来那个。'],
    ['verify', '重跑验证，对照上次结果', '上次：' + VERIFY[p.verify.state] + (p.verify.note ? '。' + p.verify.note : '')],
    ['desk', '在台账里更新未提交改动数和下一步动作', '']
  ].filter(Boolean);
  return { F, T, miss, pre, post, preChecks, postChecks, tr, dirty, WIP, BR };
}

/* ---------- 渲染 ---------- */
function cmdBlock(b) {
  const id = 'cmd' + (++S.cmdSeq);
  CMDS[id] = b.lines.filter(l => typeof l === 'string').join('\n');
  const body = b.lines.map(l => (typeof l === 'string' ? esc(l) : `<span class="c"># ${esc(l.n)}</span>`)).join('\n');
  const tag = b.kind === 'remote' ? '<span class="ktag remote">写入远程，确认后再执行</span>' : b.kind === 'read' ? '<span class="ktag">只读</span>' : '<span class="ktag">只改本机</span>';
  return `<div class="cmd ${b.kind === 'remote' ? 'remote' : ''}"><div class="cmd-head"><b>${esc(b.title)}</b>${tag}${b.where ? `<span class="faint">${esc(b.where)}</span>` : ''}<button type="button" class="btn small" data-act="copy" data-c="${id}" id="b-${id}">复制命令</button></div><pre id="${id}">${body}</pre></div>`;
}
const tierPill = (t, extra) => `<span class="tier ${t}">${TIER[t].label}${extra ? ' · ' + esc(extra) : ''}</span>`;
const devChip = (id, solid) => `<span class="chip ${solid ? 'solid' : ''}">${esc(dev(id).name)}</span>`;

  b.textContent = S.mode === 'file' ? '文件模式，Claude Code、Codex 和 Antigravity 共用这份台账' : S.mode === 'db' ? '云端保存，两台设备共用一份' : S.mode === 'local' ? '本地模式，只存在这个浏览器' : '正在连接';

  $('#tabs').innerHTML = tabs.map(([v, t, c]) => `<button type="button" class="tab" role="tab" id="tab-${v}" aria-selected="${S.view === v}" data-act="tab" data-v="${v}">${t}${c !== '' ? `<span class="n ${v === 'inbox' && c > 0 ? 'hot' : ''}">${c}</span>` : ''}</button>`).join('');

}

function renderTrack() {
  const lane = d => {
    const ps = S.projects.filter(p => p.device === d.id && !p.handoff);
    const dirty = S.projects.filter(p => p.device === d.id && p.dirty > 0).length;
    const sess = S.projects.reduce((a, p) => a + p.sessions.filter(s => s.device === d.id && s.kind !== 'cloud').length, 0);
    const all = S.projects.filter(p => p.device === d.id).length;
    return `<div class="lane"><div class="lane-head"><span class="os">${osTag(d)}</span><h2>${esc(d.name)}</h2>${S.here === d.id ? '<span class="chip solid">本机</span>' : ''}</div>
      <p class="lane-stats"><span><b>${all}</b>个项目在这里</span><span><b>${dirty}</b>个有未提交改动</span><span><b>${sess}</b>个本地 Session</span></p>
      <div class="lane-chips">${ps.map(p => `<button type="button" class="pchip" data-act="open" data-id="${esc(p.id)}" title="${esc(p.name)}"><span>${esc(p.name)}</span>${p.dirty > 0 ? '<i title="有未提交改动"></i>' : ''}</button>`).join('') || '<span class="faint">' + (S.projectsLoaded ? '没有停在这里的项目' : '正在读取') + '</span>'}</div></div>`;
  };
  const moving = S.projects.filter(p => p.handoff);
  const devs = S.config.devices;
  const trackEl = $('#track');
  if (devs.length === 2) {
    const [A, B] = devs;
    const mid = `<div class="transit"><h2>交接区</h2>${moving.map(p => `<button type="button" class="pchip" data-act="relay" data-id="${esc(p.id)}"><span>${esc(p.name)} ${p.handoff.from === A.id ? '→' : '←'}</span></button>`).join('') || '<p>没有进行中的接力</p>'}</div>`;
    trackEl.className = 'track';
    trackEl.innerHTML = lane(A) + mid + lane(B);
  } else {
    const mid = `<div class="transit"><h2>交接区</h2>${moving.map(p => `<button type="button" class="pchip" data-act="relay" data-id="${esc(p.id)}"><span>${esc(p.name)} (${esc(dev(p.handoff.from).name)} → ${esc(dev(p.handoff.to).name)})</span></button>`).join('') || '<p>没有进行中的接力</p>'}</div>`;
    trackEl.className = 'track multi';
    trackEl.innerHTML = devs.map(lane).join('') + mid;
  }
}

function filtered() {
  const f = S.filters, q = f.q.trim().toLowerCase(), rank = { active: 0, blocked: 1, paused: 2, done: 3 };
  return S.projects.filter(p => {
    if (q && !(p.name + ' ' + Object.values(p.paths).join(' ') + ' ' + p.branch + ' ' + p.worktree).toLowerCase().includes(q)) return false;
    if (f.device && p.device !== f.device) return false;
    if (f.tool && !toolsOf(p.tool).includes(f.tool)) return false;
    if (f.status === 'transit' ? !p.handoff : f.status && p.status !== f.status) return false;
    if (f.dirty === 'yes' && !(p.dirty > 0)) return false;
    if (f.dirty === 'no' && p.dirty > 0) return false;
    return true;
  }).sort((a, b) => (rank[a.status] - rank[b.status]) || String(b.updatedAt).localeCompare(String(a.updatedAt)) || a.name.localeCompare(b.name));
}

    <section class="sec"><h4>本地状态登记<small>点设备名切换，它决定上面的分级</small></h4><div class="reg">${reg}</div></section>

function viewProjects() {

const SYNC_STATUS = { success: '成功', partial: '部分失败（自动重试中）', needs_action: '需要处理', cancelled: '已取消' };
const SYNC_CLASS = { transient_transport: '暂时性传输失败', needs_user_action: '需要操作', integrity: '完整性失败', local_busy: '本机忙' };
const SYNC_PEER = { healthy: '正常', backoff: '重试中', parked: '需要处理' };
function syncEventText(e) {
  switch (e.kind) {
    case 'run_started': return '开始持续同步（每 ' + e.interval + ' 秒一轮，最长退避 ' + e.maxBackoff + ' 秒）';
    case 'snapshot_cached': return '缓存快照 ' + (e.snapshotId || '') + (e.isForwarded ? '（经转发）' : '');
    case 'snapshot_forwarded': return '转发快照 ' + (e.snapshotId || '') + ' → ' + (e.toAlias || e.peerDeviceId || '');
    case 'receipt_synced': return '签收回执 ' + (e.relayId || '') + '（' + (e.toDeviceId || '') + '）';
    case 'fork_detected': return '检测到版本分叉：' + (e.localVersion || '') + ' / ' + (e.incomingVersion || '');
    case 'lineage_unproven': return '证据不足（不是版本分叉）：' + (e.localVersion || '') + ' / ' + (e.incomingVersion || '') + '，缺少可验证的父版本 ' + (e.missingVersions || []).join('、');
    case 'lineage_resolved': return (e.relation === 'fork' ? '补齐父版本证据后确认版本分叉：' : '已补齐父版本证据，在同一条版本链上：') + (e.localVersion || '') + ' / ' + (e.incomingVersion || '');
    case 'problem': return '[' + (SYNC_CLASS[e.errorClass] || e.errorClass) + '] ' + (e.message || e.key || '');
    case 'resolved': return '已恢复：' + (e.key || '');
    case 'peer_state': return '对端 ' + (e.peerDeviceId || '') + '：' + (SYNC_PEER[e.from] || e.from) + ' → ' + (SYNC_PEER[e.to] || e.to);
    case 'trust_changed': return '信任配置变化：' + (e.what === 'identity' ? '本机密钥' : e.what === 'connection' ? '云存储连接' : '对端 ' + (e.peerDeviceId || ''));
    case 'round_skipped': return '本机忙，跳过本轮';
    case 'backoff': return '云端暂时不可用，' + e.retryInSec + ' 秒后重试';
    case 'have_published': return '已更新本机缓存清单（' + (e.count || 0) + ' 个快照）';
    default: return e.kind;
  }
}
function syncProblemsHtml(list) {
  if (!Array.isArray(list) || !list.length) return '';
  return `<ul class="sync-problems">${list.slice(0, 20).map(p => `<li><span class="chip ${p.errorClass === 'transient_transport' || p.errorClass === 'local_busy' ? '' : 'warn'}">${esc(SYNC_CLASS[p.errorClass] || p.errorClass)}</span> ${esc(p.message || p.key || '')}${p.action ? `<br><span class="muted">处理：</span><code class="sync-action">${esc(p.action)}</code>` : ''}</li>`).join('')}</ul>`;
}
function syncWatchPanel() {
  const w = S.cloud.syncWatch;
  if (!w.running && !w.runId) return w.error ? `<div class="notice">${esc(w.error)}</div>` : '';
  const chip = w.running
    ? `<span class="chip solid" id="sync-watch-status">运行中${w.status && w.status !== 'success' ? ' · ' + esc(SYNC_STATUS[w.status] || w.status) : ''}</span>`
    : `<span class="chip ${w.status === 'success' ? '' : 'warn'}" id="sync-watch-status">${esc(SYNC_STATUS[w.status] || w.status || '已停止')}</span>`;
  const c = w.counters || {};
  const counters = `第 ${Number(w.cycles) || 0} 轮 · 快照 ${Number(c.snapshotsCached) || 0} · 转发 ${Number(c.forwarded) || 0} · 回执 ${Number(c.receiptsSynced) || 0} · 重试 ${Number(c.retriesScheduled) || 0}`;

      <div class="steps"><div>${chk('post', plan.postChecks)}</div><div class="cmds">${plan.post.map(cmdBlock).join('')}</div></div>
      <div class="row"><button type="button" class="btn primary" data-act="finishHandoff" data-id="${pid}" id="fh-${pid}">接力完成，项目现在在 ${esc(plan.T.name)}</button></div>
    </div>${secrets}`;
}

function viewRegistry() {
  const devs = S.config.devices, here = S.here ? dev(S.here) : devs[0], others = othersOf(here.id);
  const there = others.find(d => d.id === S.targetDev._global) || others[0] || devs[0];
  const legend = `<div class="legend">${TIER_ORDER.map(t => `<div>${tierPill(t)}<p>${TIER[t].desc}</p></div>`).join('')}</div>`;
  const matrix = `<div class="panel"><h3>Session 能不能跨设备</h3><div class="scroll-x"><table class="t"><thead><tr><th>类型</th><th>在原设备</th><th>在另一台设备</th><th>怎么做</th></tr></thead><tbody>${SESSION_MATRIX.map(r => `<tr><td><b>${r[0]}</b></td><td><div class="cell-stack">${tierPill(r[1])}<span class="muted">${r[2]}</span></div></td><td><div class="cell-stack">${tierPill(r[3])}<span class="muted">${r[4]}</span></div></td><td class="muted">${esc(r[5])}</td></tr>`).join('')}</tbody></table></div>
    <p class="foot">Codex 与 Antigravity 的命令以你安装的版本为准。只用桌面端或 IDE 时，从左侧会话/线程列表恢复。</p></div>`;
  const greg = S.config.reg;
  const row = k => `<tr><td><div class="cell-stack"><b>${esc(k.label)}</b><code class="muted">${esc(k.path)}</code></div></td><td>${tierPill(k.tier)}</td><td><div class="togs">${devs.map(d => `<button type="button" class="tog" id="gt-${k.id}-${esc(d.id)}" aria-pressed="${!!(greg[k.id] && greg[k.id].on && greg[k.id].on[d.id])}" data-act="gregTog" data-k="${k.id}" data-d="${esc(d.id)}">${esc(d.name)}</button>`).join('')}</div></td><td class="muted">${esc(k.how)}</td><td><input class="inp" style="min-width:150px" id="gn-${k.id}" data-chg="gregNote" data-k="${k.id}" value="${esc((greg[k.id] && greg[k.id].note) || '')}" placeholder="备注" aria-label="${esc(k.label)} 的备注"></td></tr>`;
  const group = (title, tool) => `<tr><td colspan="5" class="lbl" style="background:var(--sunken)">${title}</td></tr>` + KINDS.filter(k => k.scope === 'global' && k.tool === tool).map(row).join('');
  const globals = `<div class="panel"><h3>每台设备上的全局状态<small>不属于某个项目，每台设备登记一次</small></h3><div class="scroll-x"><table class="t"><thead><tr><th>内容</th><th>分级</th><th>存在于</th><th>怎么带过去</th><th>备注</th></tr></thead><tbody>${group('Claude Code', 'claude')}${group('Codex', 'codex')}${group('Antigravity', 'anti')}${group('VS Code', 'shared')}</tbody></table></div></div>`;
  let DF = here.drop || `<${here.name} 的中转目录>`, DT = there.drop || `<${there.name} 的中转目录>`;
  const out = [], back = [];
  Object.entries(GLOBAL_COPY).forEach(([id, g]) => {
    if (!(greg[id] && greg[id].on && greg[id].on[here.id])) return;
    if (g.dir) { out.push(cpDir(here, homeP(here, g.rel), joinP(here, DF, g.drop), { xd: g.xd })); back.push(cpDir(there, joinP(there, DT, g.drop), homeP(there, g.rel), { xd: g.xd })); }
    else if (g.review) {
      const f = g.drop + '.' + osSlug(here) + g.ext;
      out.push(cpFile(here, homeP(here, g.rel), joinP(here, DF, f)));
      back.push({ n: '只对照，不覆盖。看完差异后手动合并' }, isWin(there) ? `Compare-Object (Get-Content "${joinP(there, DT, f)}") (Get-Content "${homeP(there, g.rel)}")` : `diff "${joinP(there, DT, f)}" "${homeP(there, g.rel)}"`);
    } else { out.push(cpFile(here, homeP(here, g.rel), joinP(here, DF, g.drop))); back.push(cpFile(there, joinP(there, DT, g.drop), homeP(there, g.rel))); }
  });
  const gTargetSel = others.length > 1 ? `<select class="inp" style="width:auto" data-chg="globalTarget" aria-label="全局同步目标设备">${others.map(d => `<option value="${esc(d.id)}" ${there.id === d.id ? 'selected' : ''}>目标：${esc(d.name)}</option>`).join('')}</select>` : '';
  const gcmd = `<div class="panel"><div class="row"><h3 style="font-size:16px">全局状态的同步命令<small class="muted" style="font-weight:400;margin-left:8px">${esc(here.name)} → ${esc(there.name)}</small></h3><span class="grow"></span>${gTargetSel}</div>${out.length ? `<div class="steps"><div class="cmds">${cmdBlock({ title: '复制到中转目录', kind: 'local', where: '在 ' + here.name + ' 的 ' + shellOf(here) + ' 里', lines: out })}</div><div class="cmds">${cmdBlock({ title: '从中转目录放回', kind: 'local', where: '在 ' + there.name + ' 的 ' + shellOf(there) + ' 里', lines: back })}</div></div><p class="foot">凭据文件不在这些命令里，也不该在中转目录里。</p>` : `<p class="muted">上表里把 ${esc(here.name)} 上存在的「需要额外同步」项点亮，这里就会生成对应的复制命令。</p>`}</div>`;
  const pref = `<div class="panel"><h3>项目内的状态<small>在每个项目里登记它存在于哪台设备</small></h3><div class="scroll-x"><table class="t"><thead><tr><th>内容</th><th>分级</th><th>说明</th></tr></thead><tbody>${KINDS.filter(k => k.scope === 'project').map(k => `<tr><td><div class="cell-stack"><b>${esc(k.label)}</b><code class="muted">${esc(k.path)}</code></div></td><td>${tierPill(k.tier)}</td><td class="muted">${esc(k.how)}</td></tr>`).join('')}</tbody></table></div></div>`;
  return legend + matrix + globals + gcmd + pref;
}

function viewConflicts() {
  const all = []; S.projects.forEach(p => p.conflicts.forEach(c => all.push([p, c])));
  all.sort((a, b) => String(b[1].date).localeCompare(String(a[1].date)));
  const list = all.length ? `<ul class="list-plain">${all.map(([p, c]) => `<li><div class="lbl" style="margin-bottom:3px">${esc(p.name)}</div><ul class="list-plain">${conflictItem(p, c)}</ul></li>`).join('')}</ul>` : '<p class="muted">还没有冲突记录。两台设备改到同一处、套用改动失败、指令版本对不上时，在对应项目里点「记录冲突」。</p>';
  const blocks = [
    cmdBlock({ title: '冲突时先看清楚', kind: 'read', where: '', lines: ['git status', { n: '只列出有冲突的文件' }, 'git diff --name-only --diff-filter=U'] }),
    cmdBlock({ title: '这台设备自己有改动时，先收起来', kind: 'local', where: '', lines: ['git stash push -u -m "local-before-handoff"', { n: '套用完带过来的内容后再取回，冲突在这一步解决' }, 'git stash pop'] }),
    cmdBlock({ title: '逐个文件决定留哪边', kind: 'local', where: '', lines: [{ n: 'ours 是这台设备原有的版本，theirs 是带过来的版本。把 <文件> 换成实际路径' }, 'git restore --ours -- <文件>', 'git restore --theirs -- <文件>'] }),
    cmdBlock({ title: '放弃这次套用', kind: 'local', where: '', lines: [{ n: '回到套用之前。前提是套用前工作区是干净的' }, 'git reset --merge'] })
  ];
  return `<div class="panel"><h3>冲突处理记录<small>${all.length} 条</small></h3><div class="row"><select class="inp" id="confProj" style="width:auto;max-width:100%" aria-label="选择项目">${S.projects.map(p => `<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('')}</select><button type="button" class="btn primary" data-act="addConflictPick" id="btn-addconf" ${S.projects.length ? '' : 'disabled'}>记录冲突</button></div>${list}</div>
    <div class="panel"><h3>处理冲突的命令</h3><p class="muted">两边都改了同一处时不强推、不覆盖。先收起一边，逐个文件决定，处理完回来记一笔。</p><div class="steps"><div class="cmds">${blocks[0]}${blocks[1]}</div><div class="cmds">${blocks[2]}${blocks[3]}</div></div></div>`;
}

function openForm(o) {
  const dlg = $('#dlg'), vals = o.values || {};
  const field = f => {
    const v = getPath(vals, f.key), id = 'fld-' + f.key.replace(/\./g, '-');
    let ctl;
    if (f.type === 'select') ctl = `<select class="inp" id="${id}" name="${f.key}">${f.options.map(([val, lab]) => `<option value="${esc(val)}" ${String(v == null ? '' : v) === String(val) ? 'selected' : ''}>${esc(lab)}</option>`).join('')}</select>`;
    else if (f.type === 'textarea') ctl = `<textarea class="inp" id="${id}" name="${f.key}" rows="3">${esc(v)}</textarea>`;
    else ctl = `<input class="inp ${f.mono ? 'mono' : ''}" id="${id}" name="${f.key}" type="${f.type || 'text'}" ${f.type === 'number' ? 'min="0" step="1" inputmode="numeric"' : ''} value="${esc(v == null ? '' : v)}" ${f.required ? 'required' : ''} autocomplete="off">`;
    return `<label class="field ${f.span === 2 ? 'span2' : ''}"><span>${esc(f.label)}</span>${ctl}${f.hint ? `<small>${esc(f.hint)}</small>` : ''}</label>`;
  };
  dlg.innerHTML = `<form class="form" id="dlgForm" novalidate><header><h3>${esc(o.title)}</h3><button type="button" class="btn small ghost" data-x id="dlg-x">关闭</button></header>
    <div class="form-body">${o.intro ? `<p class="muted">${esc(o.intro)}</p>` : ''}<div class="form-grid">${o.fields.map(field).join('')}</div></div>
    <footer>${o.onDelete ? '<button type="button" class="btn danger ghost" data-del id="dlg-del">删除</button>' : ''}<span class="grow"></span><button type="button" class="btn ghost" data-x id="dlg-cancel">取消</button><button type="submit" class="btn primary" id="dlg-save">保存</button></footer></form>`;
  const form = $('#dlgForm', dlg);
  form.addEventListener('submit', e => {
    e.preventDefault();
    const out = clone(vals);
    for (const f of o.fields) {
      const el = form.elements[f.key]; let v = el.value;
      if (f.type === 'number') v = v === '' ? (f.nullable ? null : 0) : Math.max(0, parseInt(v, 10) || 0);
      else v = v.trim();
      if (f.required && !v) { el.focus(); toast('请填写「' + f.label + '」。'); return; }
      setPath(out, f.key, v);
    }
    dlg.close(); o.onSave(out);
  });
  dlg.onclick = e => {
    if (e.target.closest('[data-x]')) { dlg.close(); return; }
    const del = e.target.closest('[data-del]');
    if (del) { if (del.dataset.armed) { dlg.close(); o.onDelete(); } else { del.dataset.armed = '1'; del.textContent = '再点一次，确认删除'; } }
  };
  if (typeof dlg.showModal === 'function') dlg.showModal(); else dlg.setAttribute('open', '');
}

function copyText(text, btn) {
  const ok = () => { if (btn) { const old = btn.textContent; btn.textContent = '已复制'; setTimeout(() => { if (btn.isConnected) btn.textContent = old; }, 1400); } };
  const fallback = () => {
    const pre = btn && document.getElementById(btn.dataset.c);
    if (pre && pre.tagName === 'TEXTAREA') pre.select();
    else if (pre) { const r = document.createRange(); r.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
    toast(pre ? '没能自动复制。内容已选中，按 Ctrl+C 或 ⌘C。' : '这里不允许自动复制，请手动选中命令复制。');
  };
  try { navigator.clipboard.writeText(text).then(ok, fallback); } catch (e) { fallback(); }
}

  const pName = (item && item.projectName) || (errData && errData.projectName) || (item && item.projectId) || item.relayId;
  const useInto = mode === 'target_dirty' || mode === 'recovery_conflict' || mode === 'version_fork';
  const suggestInto = useInto && knownPath ? knownPath + '-' + String(item.relayId || 'relay').slice(-6) : '';
  const reasons = errData && Array.isArray(errData.reasons) && errData.reasons.length ? `<ul>${errData.reasons.map(r => `<li>${esc(r)}</li>`).join('')}</ul>` : '';
  const hdr = mode === 'recovery_conflict' ? '事务恢复冲突 · 接收至新目录'
    : mode === 'version_fork' ? '版本分叉冲突 · 接收至新目录'
    : mode === 'target_dirty' ? '保护原目录 · 接收至新目录'
    : '接收交接包 · ' + pName;
  const calloutTitle = mode === 'recovery_conflict' ? '检测到中断后的本地改动冲突，原目录已完整保留！'
    : mode === 'version_fork' ? '检测到跨设备版本分叉，原目录已完整保留！'
    : '检测到本机原目录含有未同步的本地改动，原目录已完整保留！';
  dlg.innerHTML = `<form class="form" id="rcvForm" novalidate>
    <header><h3>${esc(hdr)}</h3><button type="button" class="btn small ghost" data-x id="rcv-x">关闭</button></header>
    <div class="form-body">
      ${useInto
        ? `<div class="callout secret"><h4>${esc(calloutTitle)}</h4>
            <p>${esc((errData && errData.error) || '本机目标目录存在冲突或未同步改动，系统已拒绝覆盖原目录，原目录文件与 Git 状态完好无损。')}</p>
            ${reasons}
            ${mode === 'recovery_conflict' ? `<div class="row"><button type="button" class="btn small" data-act="recoverStatus" data-r="${esc(item.relayId || '')}">检查中断事务详情</button></div>` : ''}
            <p class="muted">你可以先处理原目录，或在下方指定一个全新的本地目录（into），把这次交接包安全恢复到新目录：</p></div>
          <label class="field"><span>接收至新目录（保留原目录不动）</span><input class="inp mono" id="rcv-into" name="into" value="${esc(suggestInto)}" placeholder="例如 /Users/you/Developer/${esc(item.projectId || 'project')}-incoming" required autocomplete="off"><small>请填写一个不存在或为空的新目录完整路径。</small></label>`
        : `<p class="muted">${esc((errData && errData.error) || '首次在这台设备上接收该项目，请指定要把代码与工作区状态恢复到的本机目录：')}</p>
          <label class="field"><span>本机项目目录（path）</span><input class="inp mono" id="rcv-path" name="path" value="${esc(knownPath)}" placeholder="例如 /Users/you/Developer/${esc(item.projectId || 'project')}" required autocomplete="off"><small>解包前会先在临时目录完成签名与完整性校验。</small></label>`}
    </div>
    <footer><span class="grow"></span><button type="button" class="btn ghost" data-x>取消</button><button type="submit" class="btn primary">${useInto ? '保留原目录，接收至新目录' : '确认接收并解包'}</button></footer>
  </form>`;
  const form = $('#rcvForm', dlg);
  form.addEventListener('submit', e => {
    e.preventDefault();
    if (useInto) {
      const v = form.elements.into.value.trim();
      if (!v) { form.elements.into.focus(); toast('请填写新的目标目录路径。'); return; }
      Cloud.receive(item.relayId, { into: v });
    } else {
      const v = form.elements.path.value.trim();
      if (!v) { form.elements.path.focus(); toast('请填写本机项目目录路径。'); return; }
      Cloud.receive(item.relayId, { path: v });
    }
  });
  dlg.onclick = e => { if (e.target.closest('[data-x]')) dlg.close(); };
  if (typeof dlg.showModal === 'function') dlg.showModal(); else dlg.setAttribute('open', '');
}

async function fetchTranscripts(opts) {
  if (S.mode !== 'file' || !S.tx.projectId) return;
  opts = opts || {};
  S.tx.loading = true; S.tx.err = '';
  renderTranscriptsModal();
  const qs = ['project=' + encodeURIComponent(S.tx.projectId)];
  if (S.tx.tool) qs.push('tool=' + encodeURIComponent(S.tx.tool));
  if (S.tx.session) qs.push('session=' + encodeURIComponent(S.tx.session));
  if (S.tx.q) qs.push('q=' + encodeURIComponent(S.tx.q));
  try {
    const r = await Store.apiReq('GET', '/api/cloud/transcripts?' + qs.join('&'), undefined, 20000);
    const d = await r.json().catch(() => ({}));
    if (!r.ok) { S.tx.err = d.error || ('读取归档对话失败（HTTP ' + r.status + '）'); S.tx.loading = false; renderTranscriptsModal(); return; }
    S.tx.data = d;
    if (opts.autoPick && !S.tx.session && !S.tx.q && Array.isArray(d.sessions) && d.sessions.length > 0) {
      S.tx.session = d.sessions[0].sessionId || '';
      await fetchTranscripts({ autoPick: false });
      return;
    }
  } catch (e) {
    S.tx.err = '读取归档历史对话失败，请检查本机 relay serve 服务。';
  }
  S.tx.loading = false;
  renderTranscriptsModal();
}

function renderTranscriptsModal() {
  const dlg = $('#txDlg'); if (!dlg) return;
  const p = S.projects.find(x => x.id === S.tx.projectId);
  const pName = (p && p.name) || S.tx.projectId;
  const d = S.tx.data || {}, sessions = Array.isArray(d.sessions) ? d.sessions : [], matches = Array.isArray(d.matches) ? d.matches : [];
  CMDS.txMarkdown = d.markdown || '';
  const side = sessions.length ? sessions.map(s => {
    const cur = S.tx.session && S.tx.session === s.sessionId;
    return `<button type="button" class="tx-sbtn" aria-current="${cur ? 'true' : 'false'}" data-act="txPick" data-sid="${esc(s.sessionId || '')}" data-tool="${esc(s.tool || '')}">
      <div class="row" style="gap:5px"><span class="chip">${esc(TOOL_LABEL[s.tool] || s.tool || '')}</span><small class="muted">${esc(s.lastUsed || '')}</small></div>
      <b style="font-weight:500;overflow-wrap:anywhere">${esc(s.title || s.sessionId || '未命名会话')}</b>
      <small class="muted"><code>${esc((s.sessionId || '').slice(0, 18))}</code> · ${Number(s.turnCount) || 0} 回合${s.originDevice ? ' · 来自 ' + esc(dev(s.originDevice).name) : ''}</small>
    </button>`;
  }).join('') : '<div class="empty" style="padding:20px 12px"><span>暂无归档会话记录</span></div>';
  let mainHtml = '';
  if (S.tx.loading) mainHtml = '<p class="muted">正在加载历史对话归档…</p>';
  else if (S.tx.err) mainHtml = `<div class="notice">${esc(S.tx.err)}</div>`;
  else {
    const hitBlock = S.tx.q ? `<div style="display:flex;flex-direction:column;gap:8px"><div class="lbl">关键词「${esc(S.tx.q)}」匹配结果（${matches.length} 条）</div>${matches.length ? matches.map(m => `<div class="tx-hit"><div class="row"><span class="chip">${esc(TOOL_LABEL[m.tool] || m.tool || '')}</span><b>${esc(m.title || m.sessionId || '')}</b>${m.role ? `<span class="muted">${esc(m.role)}</span>` : ''}<span class="grow"></span>${m.sessionId ? `<button type="button" class="btn small" data-act="txPick" data-sid="${esc(m.sessionId)}" data-tool="${esc(m.tool || '')}">查看完整对话</button>` : ''}</div><pre class="tx-md">${esc(m.snippet || m.content || m.text || '')}</pre></div>`).join('') : '<p class="muted">没有找到包含该关键词的历史对话片段。</p>'}</div>` : '';
    const mdBlock = d.markdown ? `<div><div class="row" style="margin-bottom:6px"><span class="lbl">完整对话全文</span><span class="grow"></span><button type="button" class="btn small" data-act="copy" data-c="txMarkdown">复制全文</button></div><pre class="tx-md" id="txMarkdown">${esc(d.markdown)}</pre></div>` : (!S.tx.q ? `<p class="muted">${sessions.length ? '点击左侧任意一条会话即可阅读完整可见对话。' : '该项目还没有归档的历史对话。经过一次云端接力后，Claude Code、Codex 和 Antigravity 的可见对话会自动去重归档到这里。'}</p>` : '');
    mainHtml = hitBlock + mdBlock;
  }
  dlg.innerHTML = `<div class="form">
    <header><h3>历史对话全文 · ${esc(pName)}</h3><button type="button" class="btn small ghost" data-act="txClose">关闭</button></header>
    <div class="form-body">
      <div class="row">
        <select class="inp" id="tx-tool" data-chg="txTool" style="width:auto"><option value="">全部工具</option><option value="claude" ${S.tx.tool === 'claude' ? 'selected' : ''}>Claude Code</option><option value="codex" ${S.tx.tool === 'codex' ? 'selected' : ''}>Codex</option><option value="anti" ${S.tx.tool === 'anti' ? 'selected' : ''}>Antigravity</option></select>
        <input class="inp" type="search" id="tx-q" value="${esc(S.tx.q)}" placeholder="输入关键词跨会话全文检索…" style="flex:1 1 220px" aria-label="检索历史对话">
        <button type="button" class="btn primary" data-act="txSearch">搜索</button>
        ${(S.tx.q || S.tx.tool) ? '<button type="button" class="btn ghost" data-act="txReset">重置</button>' : ''}
      </div>
      <div class="tx-layout"><div class="tx-side">${side}</div><div class="tx-main">${mainHtml}</div></div>
      <p class="foot">归档文件存于本机 <code>${esc(d.archiveDir || '~/.relay-desk/archives/' + S.tx.projectId)}</code>（按工具、Session ID 与内容版本自动去重）。仅供跨设备查阅上下文，不等于在当前设备恢复原本地 Session。</p>
    </div>
  </div>`;
}

function openTranscriptsModal(projectId, sid, tool) {
  if (S.mode !== 'file' || !projectId) return;
  S.tx = { projectId, session: sid || '', tool: tool || '', q: '', loading: true, data: null, err: '' };
  const dlg = $('#txDlg');
  renderTranscriptsModal();
  if (typeof dlg.showModal === 'function') { if (!dlg.open) dlg.showModal(); } else dlg.setAttribute('open', '');
  fetchTranscripts({ autoPick: !sid });
}

/* ---------- 交互 ---------- */
const ACT = {
  tab: el => {
    S.view = el.dataset.v;
    renderAll();
    if (S.mode === 'file' && (S.view === 'inbox' || S.view === 'settings' || S.view === 'relay')) Cloud.refresh({ inbox: true });
  },
  toggle: el => { S.open = S.open === el.dataset.id ? null : el.dataset.id; renderAll(); },
  open: el => { S.view = 'projects'; S.open = el.dataset.id; S.filters = { q: '', device: '', tool: '', status: '', dirty: '' }; ['f-q', 'f-tool', 'f-status', 'f-dirty'].forEach(i => { $('#' + i).value = ''; }); renderAll(); const r = document.getElementById('row-' + el.dataset.id); if (r) r.scrollIntoView({ block: 'nearest' }); },
  clearFilters: () => { S.filters = { q: '', device: '', tool: '', status: '', dirty: '' }; ['f-q', 'f-tool', 'f-status', 'f-dirty'].forEach(i => { $('#' + i).value = ''; }); renderAll(); },
  newProject: () => openForm({
    title: '登记项目', fields: projectFields(),
    values: { device: S.here || S.config.devices[0].id, tool: 'claude', status: 'active', paths: {}, verify: { state: 'none' }, dirty: 0, unpushed: null, branch: 'main', remote: 'origin' },
    onSave: v => { v.id = rid('p_'); v.updatedAt = new Date().toISOString(); v.updatedOn = S.here || ''; S.open = v.id; Store.saveProject(normProject(v)); }
  }),
  editProject: el => { const p = S.projects.find(x => x.id === el.dataset.id); if (!p) return; openForm({ title: '编辑项目', fields: projectFields(), values: p, onSave: v => mutate(p.id, c => Object.assign(c, v)), onDelete: () => { if (S.open === p.id) S.open = null; Store.deleteProject(p.id); } }); },
  addSession: el => editSession(el.dataset.id, null),
  editSession: el => editSession(el.dataset.id, el.dataset.s),
  addConflict: el => editConflict(el.dataset.id, null),
  addConflictPick: () => { const s = $('#confProj'); if (s && s.value) editConflict(s.value, null); },
  editConflict: el => editConflict(el.dataset.id, el.dataset.c),
  regTog: el => mutate(el.dataset.id, c => { const r = c.reg[el.dataset.k] || (c.reg[el.dataset.k] = { on: {} }); r.on = r.on || {}; r.on[el.dataset.d] = !r.on[el.dataset.d]; }),
  gregTog: el => { const g = S.config.reg; const r = g[el.dataset.k] || (g[el.dataset.k] = { on: {} }); r.on = r.on || {}; r.on[el.dataset.d] = !r.on[el.dataset.d]; Store.saveConfig(); },
  relay: el => { S.view = 'relay'; S.relayPid = el.dataset.id; renderAll(); if (S.mode === 'file') Cloud.refresh({ inbox: true }); window.scrollTo({ top: $('#tabs').offsetTop - 8 }); },
  goCloudSettings: () => { S.view = 'settings'; renderAll(); if (S.mode === 'file') Cloud.refresh({ inbox: true }); window.scrollTo({ top: $('#tabs').offsetTop - 8 }); },
  cloudRefresh: () => Cloud.refresh({ inbox: true, manual: true }),
  cloudPairPublish: () => Cloud.pair(false),
  cloudPairAccept: () => Cloud.pair(true),
  cloudPickPeer: el => { S.cloud.selectedPeer = el.dataset.did || ''; renderAll(); },
  cloudSend: el => Cloud.send(el.dataset.id, el.dataset.to || S.cloud.cloudTarget[el.dataset.id] || ''),
  cloudPublish: el => Cloud.publish(el.dataset.id),
  cloudSync: el => Cloud.sync(el.dataset.id || ''),
  cloudWatchStart: el => Cloud.watchStart(el.dataset.id || ''),
  cloudWatchStop: () => Cloud.watchStop(),
  cloudWatchPoll: () => Cloud.watchPoll(),
  cloudReissue: el => Cloud.send(el.dataset.id, el.dataset.to || S.cloud.cloudTarget[el.dataset.id] || '', true),
  cloudDoctor: () => Cloud.health(true),
  cloudCachePreview: () => Cloud.cachePreview(),
  recoverStatus: el => Cloud.recover(el.dataset.r, 'status'),
  recoverRollback: el => Cloud.recover(el.dataset.r, 'rollback'),
  recoverClear: () => { S.cloud.recoverInfo = null; S.cloud.recoverError = ''; renderAll(); },
  addDevice: () => openForm({
    title: '新增设备',
    fields: [
      { key: 'id', label: '设备别名（唯一 ID）', mono: true, required: true, hint: '1~40 位字母、数字、下划线、点或连字符，例如 c 或 linux-server。' },
      { key: 'name', label: '设备名称', required: true, hint: '例如 公司 Linux 工作站。' },
      { key: 'os', label: '系统', type: 'select', options: [['windows', 'Windows（PowerShell）'], ['mac', 'macOS（zsh）'], ['linux', 'Linux（bash）']] },
      { key: 'drop', label: '中转目录（可选）', mono: true, span: 2 }
    ],
    values: { id: '', name: '', os: 'linux', drop: '' },
    onSave: v => {
      if (!/^[A-Za-z0-9_.-]{1,40}$/.test(v.id)) { toast('设备别名只能包含 1~40 位字母、数字、_、. 或 -。'); return; }
      if (S.config.devices.some(d => d.id.toLowerCase() === v.id.toLowerCase())) { toast('已存在相同设备别名：' + v.id); return; }
      if (S.config.devices.some(d => d.name.trim().toLowerCase() === v.name.trim().toLowerCase())) { toast('已存在相同设备名称：' + v.name); return; }
      S.config.devices.push({ id: v.id, name: v.name, os: v.os, drop: v.drop || '', host: '', deviceId: '' });
      Store.saveConfig();
      toast('已新增设备：' + v.name);
    }
  }),
  receiveRelay: el => {
    const relayId = el.dataset.r;
    const item = S.cloud.incoming.find(x => x.relayId === relayId) || { relayId };
    const hereId = (S.cloud.status && S.cloud.status.alias) || S.here;
    const proj = item.projectId ? S.projects.find(x => x.id === item.projectId) : null;
    const knownPath = proj && hereId && proj.paths && proj.paths[hereId];
    if (!item.pendingAck && !knownPath) { openReceiveModal(item, 'need_path', null); return; }
    Cloud.receive(relayId, {});
  },
  receiveRelayInto: el => {
    const relayId = el.dataset.r;
    const item = S.cloud.incoming.find(x => x.relayId === relayId) || { relayId };
    openReceiveModal(item, 'target_dirty', { error: '你将把这次交接包恢复到一个新的本地目录，原目录保持不变。' });
  },
  openTranscripts: el => openTranscriptsModal(el.dataset.id, el.dataset.sid || '', el.dataset.tool || ''),
  txClose: () => { const d = $('#txDlg'); if (d) d.close(); },
  txPick: el => { S.tx.session = el.dataset.sid || ''; if (el.dataset.tool && !S.tx.tool) {} fetchTranscripts({ autoPick: false }); },
  txSearch: () => { const qEl = $('#tx-q'); S.tx.q = qEl ? qEl.value.trim() : ''; S.tx.session = ''; fetchTranscripts({ autoPick: false }); },
  txReset: () => { S.tx.q = ''; S.tx.tool = ''; S.tx.session = ''; fetchTranscripts({ autoPick: true }); },
  startHandoff: el => mutate(el.dataset.id, c => {
    const from = dev(c.device), to = targetForProject(c), avail = c.branch ? ['remote', 'bundle', 'patch'] : ['folder'];
    let tr = S.draft[c.id] || defaultTransport(c); if (!avail.includes(tr) || (tr === 'remote' && !c.remote)) tr = c.branch ? 'bundle' : 'folder';
    c.handoff = { tag: localDate().replace(/-/g, '') + '-' + osSlug(from), from: from.id, to: to.id, transport: tr, state: 'prep', pre: {}, post: {}, hadDirty: c.dirty > 0, branch: c.branch, baseCommit: '', createdAt: new Date().toISOString() };
  }),
  markTransit: el => mutate(el.dataset.id, c => { if (c.handoff) c.handoff.state = 'transit'; }),
  finishHandoff: el => { mutate(el.dataset.id, c => { const h = c.handoff; if (!h) return; c.history = c.history.concat({ tag: h.tag, from: h.from, to: h.to, transport: h.transport, doneAt: new Date().toISOString() }).slice(-10); c.device = h.to; c.handoff = null; }); toast('已记下：项目现在在目标设备。'); },
  cancelHandoff: el => { if (!el.dataset.armed) { el.dataset.armed = '1'; el.textContent = '再点一次，确认取消'; return; } mutate(el.dataset.id, c => { c.handoff = null; }); },
  copy: el => copyText(CMDS[el.dataset.c] || '', el),
  exportJson: () => { S.io = JSON.stringify({ app: 'relaydesk', version: 2, exportedAt: new Date().toISOString(), config: S.config, projects: S.projects }, null, 2); $('#io').value = S.io; toast('备份已生成。'); },
  copyExport: el => { const t = $('#io').value; if (!t) { toast('先点「生成备份」。'); return; } el.dataset.c = 'io'; copyText(t, el); },
  importJson: el => {
    let d; try { d = JSON.parse($('#io').value); } catch (e) { toast('这不是有效的备份内容。'); return; }
    if (!d || !Array.isArray(d.projects)) { toast('备份里没有项目列表。'); return; }
    if (!el.dataset.armed) { el.dataset.armed = '1'; el.textContent = '再点一次，确认覆盖 ' + S.projects.length + ' 个项目'; return; }
    Store.replaceAll(d); toast('已导入 ' + d.projects.length + ' 个项目。');
  }
};
const CHG = {
  here: el => { S.here = el.value === 'none' ? null : el.value; try { localStorage.setItem('relaydesk.here', el.value); } catch (e) {} renderAll(); },
  filter: el => { S.filters[el.dataset.f] = el.value; renderAll(); },
  relaySel: el => { S.relayPid = el.value || null; renderAll(); },
  handoffTo: el => { S.targetDev[el.dataset.id] = el.value; renderAll(); },
  globalTarget: el => { S.targetDev._global = el.value; renderAll(); },
  cloudTarget: el => { S.cloud.cloudTarget[el.dataset.id] = el.value; renderAll(); },
  cloudPeerSel: el => { S.cloud.selectedPeer = el.value; renderAll(); },
  draftTr: el => { S.draft[el.dataset.id] = el.value; },
  chk: el => mutate(el.dataset.id, c => { if (!c.handoff) return; const ph = el.dataset.ph; c.handoff[ph] = c.handoff[ph] || {}; c.handoff[ph][el.dataset.k] = el.checked; }),
  baseCommit: el => mutate(el.dataset.id, c => { if (c.handoff) c.handoff.baseCommit = el.value.trim(); }),
  gregNote: el => { const g = S.config.reg; const r = g[el.dataset.k] || (g[el.dataset.k] = { on: {} }); r.note = el.value.trim(); Store.saveConfig(); },
  cfg: el => { const d = S.config.devices[+el.dataset.i]; if (!d) return; const v = el.value.trim(); if (el.dataset.k === 'name' && !v) { el.value = d.name; return; } d[el.dataset.k] = v; Store.saveConfig(); },
  cloudRemoteSel: el => { if (el.value) { S.cloud.form.remote = el.value; S.cloud.form.touched = true; const inp = $('#cloud-remote'); if (inp) inp.value = el.value; } },
  txTool: el => { S.tx.tool = el.value; S.tx.session = ''; fetchTranscripts({ autoPick: !S.tx.q }); }
};
document.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (el && ACT[el.dataset.act] && !el.disabled) ACT[el.dataset.act](el, e); });
document.addEventListener('change', e => { const el = e.target.closest('[data-chg]'); if (el && CHG[el.dataset.chg]) CHG[el.dataset.chg](el, e); });
document.addEventListener('input', e => {
  if (e.target.id === 'f-q') { S.filters.q = e.target.value; renderView(); }
  else if (e.target.id === 'io') S.io = e.target.value;
  else if (e.target.id === 'cloud-remote') { S.cloud.form.remote = e.target.value; S.cloud.form.touched = true; }
  else if (e.target.id === 'cloud-root') { S.cloud.form.root = e.target.value; S.cloud.form.touched = true; }
  else if (e.target.id === 'tx-q') S.tx.q = e.target.value;
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target && e.target.id === 'tx-q') { e.preventDefault(); ACT.txSearch(); }
});
document.addEventListener('focusout', () => setTimeout(() => { if (S.pending) renderAll(); }, 0));

pickHere(); renderAll(); Store.init();
})();
</script>
